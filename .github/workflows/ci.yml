name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC

jobs:
  actionlint:
    name: Lint GitHub Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  api-docs:
    name: API docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Regenerate API table
        working-directory: backend
        run: npm run docs:api
      - name: Check generated API docs
        run: git diff --exit-code -- docs/API.md

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      SMTP_HOST: ""
      SKIP_CONTRACT_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install dependencies
        run: npm install

      # Jest only loads modules a test touches and mocks hide syntax errors, so parse every source file.
      - name: Syntax check backend sources
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint backend for duplicate/unreachable code
        run: >-
          npx eslint src --no-eslintrc --parser-options ecmaVersion:latest
          --env node,es2021
          --rule '{"no-dupe-keys":"error","no-redeclare":"error","no-unreachable":"error","no-dupe-class-members":"error"}'

      # Route handlers must use the async db.query() adapter. The legacy
      # better-sqlite3 db.prepare() API does not exist on the Postgres adapter,
      # so any lingering call fails at runtime (see reviews route migration).
      - name: Forbid synchronous db.prepare in routes
        run: |
          if grep -rn --include='*.js' 'db\.prepare' src/routes; then
            echo "::error::Use the async db.query() adapter instead of db.prepare() in route handlers"
            exit 1
          fi

      # Boots the real server (in-memory SQLite) so import-time failures in any module surface here.
      - name: Boot server and poll health
        env:
          PORT: 4000
          SQLITE_PATH: ':memory:'
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_ESCROW_CONTRACT_ID: ci-placeholder
          SOROBAN_XLM_TOKEN_CONTRACT_ID: ci-placeholder
        run: |
          node src/index.js > "$RUNNER_TEMP/boot.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited during boot"; cat "$RUNNER_TEMP/boot.log"; exit 1
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/v1/health)" = "200" ]; then
              echo "Health check returned 200"
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not return 200 within 30s"; cat "$RUNNER_TEMP/boot.log"
          kill "$pid"
          exit 1

      - name: Run tests with coverage
        run: npm run test:coverage

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  frontend-bundle-size:
    name: Frontend Bundle Size Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budgets
        # BUNDLE_INITIAL_BUDGET_KB: max KiB for vendor+index (initial load, uncompressed)
        # BUNDLE_INITIAL_GZIP_BUDGET_KB: max KiB gzip for vendor+index (initial load, wire size; #1695)
        # BUNDLE_TOTAL_BUDGET_KB:   max KiB for all JS chunks combined (uncompressed)
        # Raise these intentionally and document the reason — never bump silently.
        env:
          BUNDLE_INITIAL_BUDGET_KB: 500
          BUNDLE_INITIAL_GZIP_BUDGET_KB: 180
          BUNDLE_TOTAL_BUDGET_KB: 5000
        run: node scripts/check-bundle-size.js

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-size
          path: |
            frontend/dist/assets/*.js
            frontend/dist/bundle-report.html
          retention-days: 30

  smoke-test-testnet:
    name: Escrow Testnet Smoke Test
    # Only on merges to main — this touches live Stellar Testnet, not on every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    env:
      ORDER_ID: ${{ github.run_id }}
      STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli@22.0.0 --features opt

      - name: Build escrow contract (release WASM)
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown -p soroban-escrow

      - name: Deploy to testnet and run deposit→release smoke test
        run: |
          set -euo pipefail
          if [ -z "${STELLAR_SECRET_KEY:-}" ]; then
            echo "::error::STELLAR_SECRET_KEY secret is not configured"
            exit 1
          fi
          stellar keys add ci --secret-key "$STELLAR_SECRET_KEY"
          WASM=../target/wasm32-unknown-unknown/release/soroban_escrow.wasm
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM" \
            --source ci \
            --network testnet)
          echo "Deployed escrow contract: $CONTRACT_ID"
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source ci \
            --network testnet \
            -- deposit \
            --order_id "$ORDER_ID"
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source ci \
            --network testnet \
            -- release \
            --order_id "$ORDER_ID"

  soroban-contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Check EscrowError codes (NEXT_CODE, no reuse, README table)
        run: bash scripts/check-escrow-error-codes.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release WASM
        run: cargo build --release --target wasm32-unknown-unknown --workspace

  soroban-wasm-size:
    name: Soroban WASM Size Budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
            contract/target
            contract/reward-token/target
          key: ${{ runner.os }}-cargo-wasm-size-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml', 'contract/Cargo.lock', 'contract/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-size-

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli@22.0.0 --features opt

      # Fails on >5% growth or a breached budget vs contracts/wasm-sizes.json.
      # To accept growth, update the baseline in the same PR with the reason.
      - name: Check WASM size budgets
        run: |
          set -o pipefail
          bash contracts/wasm-profile.sh --check contracts/wasm-sizes.json | tee "$RUNNER_TEMP/wasm-size-table.md"

      - name: Comment size table on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true  # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -s "$RUNNER_TEMP/wasm-size-table.md" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/wasm-size-table.md"
          fi
