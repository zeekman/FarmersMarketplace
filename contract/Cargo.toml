[package]
name = "escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

# Pinned to the legacy SDK generation used throughout `contract/`. This is
# intentionally older than the `=22.0.0` pin in `contracts/` — see ADR 0001
# (docs/adr/0001-soroban-contract-boundaries.md) for why the two layouts are
# not unified yet.
[dependencies]
soroban-sdk = { version = "=21.7.7" }

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
