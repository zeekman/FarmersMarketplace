[package]
name = "carbon-offset"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Legacy crate built alongside `contract/`; see ADR 0002 for the removal plan
# (docs/adr/0002-contract-architecture.md).
[dependencies]
soroban-sdk = "=22.0.0"

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
soroban-sdk = "=23.0.0"

[dev-dependencies]
soroban-sdk = { version = "=23.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
