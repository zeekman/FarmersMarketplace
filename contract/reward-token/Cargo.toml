[package]
name = "reward-token"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Paired with the legacy `contract/` integration surface, hence the same SDK
# generation. See ADR 0001 (docs/adr/0001-soroban-contract-boundaries.md).
[dependencies]
soroban-sdk = { version = "=21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
