# Farmers Marketplace — production nginx config
#
# Serves the built SPA from frontend/dist and proxies dynamic paths to the
# Node backend. Dynamic locations MUST be declared before the static asset
# regex locations so they are not shadowed by the image/asset matchers.

upstream farmers_marketplace_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default body size for regular requests. Upload locations below raise
    # this to cover the 50 MB video upload limit enforced by the backend.
    client_max_body_size 10M;

    # --- Dynamic paths (must precede the static regex locations) -----------

    # Product images and videos are stored on the backend, not in dist/.
    # Without this proxy every /uploads/<file> request 404s in production.
    location /uploads/ {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 50 MB video upload limit (see Dashboard.jsx / productVideos.js).
        client_max_body_size 50M;

        # Uploaded media is immutable; let clients cache it aggressively.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SEP-1 stellar.toml. Must be proxied so the backend's
    # Access-Control-Allow-Origin: * header actually reaches wallets.
    location = /.well-known/stellar.toml {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        default_type application/toml;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-2 federation endpoint (name*domain resolution).
    location /federation {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Sitemap and robots are generated by the backend, not the SPA shell.
    location = /sitemap.xml {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---------------------------------------------------------------

    location /api/ {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads through the API (e.g. product videos) may reach 50 MB.
        client_max_body_size 50M;
    }

    # Swagger UI is served by the backend at /api/docs.
    location /api/docs {
        proxy_pass http://farmers_marketplace_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets -----------------------------------------------------

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|mp4|webm|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
