[package]
name = "fm-math"
version = "0.1.0"
edition = "2021"
publish = false
# Pure arithmetic crate — no Soroban SDK dependency, works in any no_std context.

[lib]
# rlib only: this crate is a shared library, never deployed as a WASM contract.
crate-type = ["rlib"]

[dependencies]
# No runtime dependencies — pure i128 arithmetic.

[dev-dependencies]
proptest = "1"
