[package]
name = "soroban-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exposes soroban-sdk testutils to the fuzz crate (fuzz/). (CT-27)
testutils = ["soroban-sdk/testutils"]

# All crates use the same exact SDK generation. See ADR 0002
# (docs/adr/0002-contract-architecture.md) for the pinning decision.
[dependencies]
soroban-sdk = { version = "=22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
ed25519-dalek = "2"
proptest = "1"

# Integration test crate for issue #1311: deploys the escrow and reward-token
# contracts together and imports the reward token as a WASM via
# `contractimport!`. The reward token still lives in the legacy `contract/`
# layout, so it is consumed here as a prebuilt WASM artifact rather than as a
# path dependency; ADR 0002 schedules that legacy crate for removal.
[[test]]
name = "reward_minting"
path = "tests/reward_minting.rs"
ed25519-dalek = "2"
contract-test-utils = { path = "../test-utils" }
