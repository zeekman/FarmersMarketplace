[package]
name = "reward-token"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

# Part of the `contracts/` workspace, same newer SDK generation as `contracts/escrow`.
# See ADR 0001 (docs/adr/0001-soroban-contract-boundaries.md).
[dependencies]
soroban-sdk = { version = "=22.0.0" }
fm-math = { path = "../fm-math" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
