[package]
name = "creator-earnings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

# Part of the `contracts/` workspace, hence the same newer SDK generation as
# `contracts/escrow`. See ADR 0001 (docs/adr/0001-soroban-contract-boundaries.md).
[dependencies]
soroban-sdk = { version = "=22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
