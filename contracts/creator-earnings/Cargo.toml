[package]
name = "creator-earnings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

# Part of the `contracts/` workspace, pinned to the same SDK generation as
# every other crate. See ADR 0002 (docs/adr/0002-contract-architecture.md).
[dependencies]
soroban-sdk = { version = "=22.0.0" }
fm-math = { path = "../fm-math" }
fm-math = { path = "../fm-math" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }
contract-test-utils = { path = "../test-utils" }
